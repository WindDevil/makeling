name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The exercises ship files whose names look like build output -- report.d,
      # blah.o, f1.out -- so a broad *.d / *.o / *.out ignore rule would drop
      # them from the repository.  They would still be there locally, which is
      # how this went unnoticed until a clone failed: the test ran against a
      # tree that had them.  Fail loudly instead.
      - name: Check no exercise file is gitignored
        run: make check-tracked

      - name: Show toolchain
        run: |
          make --version
          python3 --version
          ./makeling doctor
      - name: Verify every solution
        run: ./makeling verify
      - name: Verify exercises start unsolved
        run: ./makeling selftest
      - name: Check generated files
        run: python3 tools/generate_exercises.py --check
      - name: Configure CMake
        run: cmake --preset default
      - name: Run CTest
        run: ctest --preset default
