name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          make --version
          python3 --version
          ./makeling doctor
      - name: Verify every solution
        run: ./makeling verify
      - name: Verify exercises start unsolved
        run: ./makeling selftest
      - name: Check generated files
        run: python3 tools/generate_exercises.py --check
      - name: Configure CMake
        run: cmake --preset default
      - name: Run CTest
        run: ctest --preset default
